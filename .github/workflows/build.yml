name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './proj/*' | head -n1)
          echo "Found zip: $ZIP"
          mkdir -p proj
          unzip -q "$ZIP" -d proj
          G=$(find proj -name settings.gradle.kts | head -n1)
          echo "Found: $G"
          D=$(dirname "$G")
          D=$(realpath "$D")
          echo "PROJ=$D" | tee -a "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: |
          for i in 1 2 3; do
            gradle :app:assembleRelease --no-daemon && exit 0
            echo "Attempt $i failed, retrying in 60s..."
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: PortYouStudio-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
