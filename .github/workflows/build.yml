name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './proj/*' | head -n1)
          [ -n "$ZIP" ] || { echo "No zip found"; exit 1; }
          echo "Found zip: $ZIP"
          mkdir -p proj
          unzip -q "$ZIP" -d proj
          G=$(find proj -maxdepth 3 -name settings.gradle.kts | head -n1)
          [ -n "$G" ] || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJ=$(dirname "$(realpath "$G")")" >>
